name = "pump-radar"
main = "src/index.js"
compatibility_date = "2026-11-20"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "PUMP_RADAR_HUB"
class_name = "PumpRadarHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PumpRadarHub"]
[vars]
ALLOWED_ORIGINS = "https://pump-radar.samuelmarv.workers.dev"
